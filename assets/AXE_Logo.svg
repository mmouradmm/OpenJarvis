<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#14213d"/><stop offset="1" stop-color="#05070f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#ring)" stroke-width="14" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="186" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-width="3" stroke-dasharray="6 14"/>
  <g filter="url(#glow)" fill="url(#x)">
    <!-- X built from two blades, one with an axe-head notch -->
    <path d="M150 140 L200 140 L362 372 L312 372 Z"/>
    <path d="M362 140 L312 140 L150 372 L200 372 Z"/>
  </g>
  <circle cx="256" cy="256" r="18" fill="#ecfeff" filter="url(#glow)"/>
</svg>
